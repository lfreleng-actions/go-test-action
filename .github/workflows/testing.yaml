---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test runs against the synthetic Go fixture ###
  test-synthetic:
    name: "Test: synthetic fixture (test-go-project, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the pure-bash path resolver, since BSD realpath
        # lacks -m; Windows runs GNU realpath from Git Bash
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # Both harden-runner actions support Linux runners only.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8 # v0.14.0
        if: runner.os == 'Linux'
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout test project: lfreleng-actions/test-go-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-go-project
          ref: cef19dc1540c955ca210d8facda9f4ea79d9bc3f # v0.1.1
          path: test-project
          persist-credentials: false

      - name: "Running local action: coverage and race defaults"
        id: default-test
        uses: $/
        with:
          path_prefix: test-project

      - name: "Running local action: plain run without coverage"
        id: plain-test
        uses: $/
        with:
          path_prefix: test-project
          coverage: 'false'
          race: 'false'
          test_args: '-count=1'
          test_target: './pkg/...'
          timeout: '5m'

      - name: "Running local action: coverage artifact upload"
        id: coverage-artifact
        uses: $/
        with:
          path_prefix: test-project
          artifact_upload: 'true'
          artifact_name: go-coverage-synthetic-${{ matrix.os }}

      # cli-test compiles the binary before exercising it, standing in
      # for projects that must build before they can test; naming two
      # targets also covers multi-word make_args
      - name: "Running local action: build+test via make"
        id: make-test
        uses: $/
        with:
          path_prefix: test-project
          make_args: 'cli-test test'

      # A missing target makes make exit non-zero whatever the fixture
      # code does, so the make path's permit_fail handling is tested
      # deterministically
      - name: "Running local action: make soft fail"
        id: make-soft-fail
        uses: $/
        with:
          path_prefix: test-project
          make_args: 'no-such-target'
          permit_fail: 'true'

      - name: "Running local action: make hard fail"
        id: make-hard-fail
        continue-on-error: true
        uses: $/
        with:
          path_prefix: test-project
          make_args: 'no-such-target'

      - name: "Verify test outputs"
        shell: bash
        env:
          DEFAULT_PASSED: ${{ steps.default-test.outputs.tests_passed }}
          DEFAULT_COVERAGE: >-
            ${{ steps.default-test.outputs.coverage_percent }}
          PLAIN_PASSED: ${{ steps.plain-test.outputs.tests_passed }}
          PLAIN_COVERAGE: >-
            ${{ steps.plain-test.outputs.coverage_percent }}
          MAKE_PASSED: ${{ steps.make-test.outputs.tests_passed }}
          MAKE_COVERAGE: ${{ steps.make-test.outputs.coverage_percent }}
          MAKE_SOFT_OUTCOME: ${{ steps.make-soft-fail.outcome }}
          MAKE_SOFT_PASSED: >-
            ${{ steps.make-soft-fail.outputs.tests_passed }}
          MAKE_HARD_OUTCOME: ${{ steps.make-hard-fail.outcome }}
        run: |
          # Verify test outputs
          errors=0
          if [ "${DEFAULT_PASSED}" != "true" ]; then
            echo "Default run: tests_passed not true ❌"
            errors=1
          fi
          # Regex validation: integer or decimal with any number of
          # places, since go tool cover output formatting is not
          # guaranteed to stay at one decimal place across versions
          if ! [[ "${DEFAULT_COVERAGE}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Default run: coverage not numeric ❌"
            echo "Reported coverage: ${DEFAULT_COVERAGE}"
            errors=1
          fi
          if [ "${PLAIN_PASSED}" != "true" ]; then
            echo "Plain run: tests_passed not true ❌"
            errors=1
          fi
          if [ -n "${PLAIN_COVERAGE}" ]; then
            echo "Plain run: unexpected coverage output ❌"
            errors=1
          fi
          if [ "${MAKE_PASSED}" != "true" ]; then
            echo "make run: tests_passed not true ❌"
            errors=1
          fi
          # The Makefile controls the make path, so the action reports
          # no coverage there
          if [ -n "${MAKE_COVERAGE}" ]; then
            echo "make run: unexpected coverage output ❌"
            errors=1
          fi
          if [ "${MAKE_SOFT_OUTCOME}" != "success" ]; then
            echo "make soft-fail run unexpectedly failed ❌"
            errors=1
          fi
          if [ "${MAKE_SOFT_PASSED}" != "false" ]; then
            echo "make soft-fail run: tests_passed not false ❌"
            errors=1
          fi
          if [ "${MAKE_HARD_OUTCOME}" = "success" ]; then
            echo "make hard-fail run unexpectedly succeeded ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Test verification failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Test outputs verified ✅"
          echo "Coverage reported: ${DEFAULT_COVERAGE}%"
          {
            echo "Test outputs verified ✅"
            echo "Coverage reported: ${DEFAULT_COVERAGE}%"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test runs against a real Gerrit-mirrored monorepo ###
  test-real:
    name: "Test: real fixture (onap/multicloud-k8s)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8 # v0.14.0
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout test project: onap/multicloud-k8s"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onap/multicloud-k8s
          ref: 5c3b1a96811024e65b0977305b6d6737a6e2d453
          path: test-project
          persist-credentials: false

      # The module's go.mod predates the go directive conventions the
      # current toolchain expects (go 1.16), so the runs pass an
      # explicit modern Go version. The internal/config and
      # internal/utils packages hold self-contained unit tests that
      # pass without external services.
      - name: "Running local action: passing package subset"
        id: subset-test
        uses: $/
        with:
          path_prefix: test-project/src/k8splugin
          go_version: '1.25.11'
          test_target: './internal/config/... ./internal/utils/...'

      # The internal/app package tests require a pre-compiled mock
      # plugin absent from the repository, so the full internal tree
      # fails deterministically: the exact case the permit_fail
      # soft-fail mode covers. The failing suite finishes in seconds,
      # but TestRollbackConfig can deadlock (an ONAP bug); the short
      # timeout bounds a hang, which these steps tolerate since they
      # expect failure
      - name: "Running local action: soft fail on failing suite"
        id: soft-fail
        uses: $/
        with:
          path_prefix: test-project/src/k8splugin
          go_version: '1.25.11'
          test_target: './internal/...'
          race: 'false'
          timeout: '3m'
          permit_fail: 'true'

      - name: "Running local action: hard fail on failing suite"
        id: hard-fail
        continue-on-error: true
        uses: $/
        with:
          path_prefix: test-project/src/k8splugin
          go_version: '1.25.11'
          test_target: './internal/...'
          race: 'false'
          timeout: '3m'

      - name: "Verify soft/hard failure semantics"
        shell: bash
        env:
          SUBSET_PASSED: ${{ steps.subset-test.outputs.tests_passed }}
          SUBSET_COVERAGE: >-
            ${{ steps.subset-test.outputs.coverage_percent }}
          SOFT_OUTCOME: ${{ steps.soft-fail.outcome }}
          SOFT_PASSED: ${{ steps.soft-fail.outputs.tests_passed }}
          HARD_OUTCOME: ${{ steps.hard-fail.outcome }}
        run: |
          # Verify soft/hard failure semantics
          errors=0
          if [ "${SUBSET_PASSED}" != "true" ]; then
            echo "Subset run: tests_passed not true ❌"
            errors=1
          fi
          if [ -z "${SUBSET_COVERAGE}" ]; then
            echo "Subset run: coverage_percent empty ❌"
            errors=1
          fi
          if [ "${SOFT_OUTCOME}" != "success" ]; then
            echo "Soft-fail run unexpectedly failed ❌"
            errors=1
          fi
          if [ "${SOFT_PASSED}" != "false" ]; then
            echo "Soft-fail run: tests_passed not false ❌"
            errors=1
          fi
          if [ "${HARD_OUTCOME}" = "success" ]; then
            echo "Hard-fail run unexpectedly succeeded ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Failure semantics tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Soft/hard failure semantics verified ✅"
          echo "Soft/hard failure semantics verified ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test invalid inputs fail closed ###
  test-failures:
    name: "Test: invalid inputs and error handling (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # Both harden-runner actions support Linux runners only.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8 # v0.14.0
        if: runner.os == 'Linux'
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Running local action with shell metacharacter args"
        id: bad-args
        continue-on-error: true
        uses: $/
        with:
          test_args: '-run $(id)'

      - name: "Running local action with invalid timeout"
        id: bad-timeout
        continue-on-error: true
        uses: $/
        with:
          timeout: '10 minutes'

      - name: "Running local action with workspace-escaping path"
        id: escape-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: /etc

      # Symlinks pointing outside the workspace and project exercise
      # the re-check after symlink resolution, and dotdot-project,
      # beside the workspace, is the target of the dot-dot escape.
      # The targets are runnable Go modules with passing tests, so
      # only the boundary checks can reject them. resolve-project
      # checks that the macOS fallback resolver and GNU realpath pick
      # the same version file. Git Bash copies rather than links
      # unless native symlinks are available, so Windows skips the
      # symlink cases when it cannot create real ones
      - name: "Create symlink fixtures"
        id: links
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: |
          # Create symlink fixtures
          # write_module DIR MODULE GO_VERSION [PACKAGE] writes a
          # go.mod and, given PACKAGE, a passing test
          write_module() {
            mkdir -p "$1"
            printf 'module %s\n\ngo %s\n' "$2" "$3" > "$1/go.mod"
            if [ -n "${4:-}" ]; then
              printf '%s\n' "package $4" "" 'import "testing"' "" \
                'func TestFixture(t *testing.T) {}' \
                > "$1/${4}_test.go"
            fi
          }
          outside="${RUNNER_TEMP}/outside-project"
          mkdir -p fixture-dir
          write_module "${outside}" example.com/outside 1.25 outside
          # fixture-dir/../../dotdot-project, from the workspace
          write_module ../dotdot-project example.com/dotdot 1.25 dotdot
          write_module link-project example.com/linkproject 1.25 \
            linkproject
          # The project's own go.mod and nested/go.mod name different
          # Go versions, so the version installed shows which one the
          # action resolved
          write_module resolve-project example.com/resolveproject \
            1.24 resolveproject
          write_module resolve-project/nested example.com/nested 1.25
          write_module resolve-project/nested/child \
            example.com/child 1.25
          if ln -s "${outside}" escape-link &&
            ln -s "${outside}/go.mod" link-project/version-link &&
            ln -s nested/child resolve-project/link &&
            [ -L escape-link ] && [ -L link-project/version-link ] &&
            [ -L resolve-project/link ]; then
            echo "symlinks=true" >> "$GITHUB_OUTPUT"
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            echo "::notice::No native symlinks; skipping symlink cases"
            echo "symlinks=false" >> "$GITHUB_OUTPUT"
          else
            echo "Error: failed to create symlink fixtures ❌"
            exit 1
          fi

      - name: "Running local action with dot-dot escaping path"
        id: escape-dotdot
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fixture-dir/../../dotdot-project

      - name: "Running local action with symlink escaping workspace"
        id: escape-symlink
        if: steps.links.outputs.symlinks == 'true'
        continue-on-error: true
        uses: $/
        with:
          path_prefix: escape-link

      - name: "Running local action with symlink go_version_file"
        id: escape-version-file
        if: steps.links.outputs.symlinks == 'true'
        continue-on-error: true
        uses: $/
        with:
          path_prefix: link-project
          go_version_file: version-link

      # Positive control: the escape fixtures are runnable, so their
      # rejections above come from the boundary checks alone
      - name: "Running local action on symlink fixture project"
        id: fixture-control
        if: steps.links.outputs.symlinks == 'true'
        continue-on-error: true
        uses: $/
        with:
          path_prefix: link-project

      # GNU 'realpath -m' resolves link after the missing component's
      # '..', selecting nested/go.mod (go 1.25), not the project's
      # go.mod (go 1.24); the macOS fallback must agree
      - name: "Running local action with dot-dot through a symlink"
        id: resolve-dotdot
        if: steps.links.outputs.symlinks == 'true'
        continue-on-error: true
        uses: $/
        with:
          path_prefix: resolve-project
          go_version_file: absent/../link/../go.mod

      - name: "Verify fixture runs and resolved Go version"
        if: steps.links.outputs.symlinks == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CONTROL_OUTCOME: ${{ steps.fixture-control.outcome }}
          RESOLVE_OUTCOME: ${{ steps.resolve-dotdot.outcome }}
        run: |
          # Verify fixture runs and resolved Go version
          errors=0
          for outcome_pair in \
            "fixture_control:${CONTROL_OUTCOME}" \
            "resolve_dotdot:${RESOLVE_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "Valid ${test_name} run failed: ${outcome} ❌"
              errors=1
            fi
          done
          # Outside any module, so go.mod cannot switch toolchains
          go_version="$(GOTOOLCHAIN=local go env GOVERSION)" ||
            go_version=""
          case "${go_version}" in
            go1.25|go1.25.*)
              echo "Resolved nested/go.mod: ${go_version} ✅" ;;
            *)
              echo "Expected go1.25 from nested/go.mod ❌"
              echo "Installed: ${go_version:-none}"
              errors=1 ;;
          esac
          if [ "${errors}" != "0" ]; then
            echo "Valid-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Fixture runs and resolved Go version verified ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "Running local action with invalid boolean"
        id: bad-bool
        continue-on-error: true
        uses: $/
        with:
          coverage: 'yes'

      - name: "Running local action with upload but no coverage"
        id: upload-no-coverage
        continue-on-error: true
        uses: $/
        with:
          coverage: 'false'
          artifact_upload: 'true'

      - name: "Running local action with flag-like test target"
        id: bad-target
        continue-on-error: true
        uses: $/
        with:
          test_target: '-x'

      - name: "Verify invalid inputs were rejected"
        shell: bash
        env:
          ARGS_OUTCOME: ${{ steps.bad-args.outcome }}
          TIMEOUT_OUTCOME: ${{ steps.bad-timeout.outcome }}
          ESCAPE_OUTCOME: ${{ steps.escape-path.outcome }}
          DOTDOT_OUTCOME: ${{ steps.escape-dotdot.outcome }}
          SYMLINK_OUTCOME: ${{ steps.escape-symlink.outcome }}
          VERSION_FILE_OUTCOME: ${{ steps.escape-version-file.outcome }}
          BOOL_OUTCOME: ${{ steps.bad-bool.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-no-coverage.outcome }}
          TARGET_OUTCOME: ${{ steps.bad-target.outcome }}
        run: |
          # Failure testing is also important; all steps MUST fail
          errors=0
          for outcome_pair in \
            "args:${ARGS_OUTCOME}" \
            "timeout:${TIMEOUT_OUTCOME}" \
            "escape:${ESCAPE_OUTCOME}" \
            "dotdot:${DOTDOT_OUTCOME}" \
            "symlink:${SYMLINK_OUTCOME}" \
            "version_file:${VERSION_FILE_OUTCOME}" \
            "bool:${BOOL_OUTCOME}" \
            "upload:${UPLOAD_OUTCOME}" \
            "target:${TARGET_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" = "success" ]; then
              echo "Invalid ${test_name} unexpectedly succeeded ❌"
              errors=1
            fi
          done
          if [ "${errors}" != "0" ]; then
            echo "Failure-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid inputs correctly rejected ✅"
          echo "Invalid inputs correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"
